name: Construção Automática (CI)

# 1. O Gatilho: executa o pipeline sempre que você enviar código (push) para a branch 'main'
on:
  push:
    branches:
      - main

jobs:
  build-docker:
    # 2. O Ambiente: o GitHub empresta uma máquina Linux que já tem o Docker instalado
    runs-on: ubuntu-latest

    steps:
      # 3. Preparação: baixa o seu código do repositório para dentro desta máquina do GitHub
      - name: Baixar o código
        uses: actions/checkout@v4

      # 4. A Ação: roda exatamente o mesmo comando que você testou no terminal
      - name: Construir a imagem Docker
        run: docker build -t teste-devops .