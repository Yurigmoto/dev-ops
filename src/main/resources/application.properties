spring.application.name=pokedex

# Configuracao do banco de dados H2 (em memoria)
spring.datasource.url=jdbc:h2:mem:pokedexdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Configuracoes do Spring MVC e Thymeleaf
spring.jpa.show-sql=false
spring.mvc.hiddenmethod.filter.enabled=true
spring.thymeleaf.cache=false
server.port=8080

# Integracao com a PokeAPI
pokeapi.url=https://pokeapi.co/api/v2