<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Tipos')}"></head>
<body>
    <div th:replace="~{fragmentos/header :: header(activePage='tipo')}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Tipos cadastrados</h2>
            <a class="btn btn-primary" th:href="@{/tipo/formulario}"><i class="fas fa-plus"></i> Novo Tipo</a>
        </div>

        <table class="table table-striped">
            <thead>
                <tr><th>Nome</th><th>Ações</th></tr>
            </thead>
            <tbody>
                <tr th:each="tipo : ${lista}">
                    <td th:text="${tipo.nome}"></td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/tipo/formulario/{id}(id=${tipo.id})}"><i class="fas fa-pen"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
